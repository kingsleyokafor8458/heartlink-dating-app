version: '3.8'

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      MONGODB_URI: mongodb://mongodb:27017/heartlink
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret-in-production}
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
      # --- Photo storage ---
      # Local testing (default): files saved to a Docker volume, served from this container.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_UPLOAD_DIR: /app/uploads
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-http://localhost:8080/uploads}
      # When you deploy to AWS, set STORAGE_PROVIDER=s3 and these (plus
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, or use an instance role):
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      # --- Password reset email ---
      # Leave SMTP_HOST unset to just log reset links to the backend console (fine for local testing).
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-no-reply@heartlink.app}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mongo_data:
  uploads_data:
