server:
  port: ${PORT:8080}

spring:
  application:
    name: heartlink-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/heartlink}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
